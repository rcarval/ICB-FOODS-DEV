<template>
    <lightning-card title={title} icon-name={iconName}>
        <div class="slds-p-around_small">
            <div class="slds-grid">
                <div class="slds-col slds-size_2-of-3">
                    <c-custom-lookup 
                        obj-name="Account" 
                        input-name="account" 
                        search-placeholder="Buscar Cuenta" 
                        field-values={accountFieldValues} 
                        icon-name="standard:account" 
                        onlookupselected={handleSelectedAccount} 
                        onvalueselectedchange={handleValueSelectedChange}
                        page-ref={pageRef}>
                    </c-custom-lookup>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <template if:false={isAccountSelected}>
                        <lightning-button 
                            disabled=""
                            label="Continuar" 
                            variant="brand" 
                            onclick={openModal}>
                        </lightning-button>
                    </template>

                    <template if:true={isAccountSelected}>
                        <lightning-button 
                            label="Continuar" 
                            variant="brand" 
                            onclick={openModal}>
                        </lightning-button>
                    </template>
                </div>
            </div>
        </div>
    </lightning-card>

    <!-- Modal Structure -->
    <template if:true={isModalOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open full-screen-modal">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-button_icon-inverse slds-modal__close" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium">Seleccionar Productos</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <c-lookup-datatable
                        selected-account-id={selectedAccountId}
                        onrecorddatachange={handleDataChange}
                    ></c-lookup-datatable>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancelar" onclick={closeModal}></lightning-button>
                    <lightning-button variant="brand" label="Continuar" onclick={handleModalContinue}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
