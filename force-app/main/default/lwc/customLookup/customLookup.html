<!--
  @description       : Generic Lookup Component to search for any given sObject.
-->
<template>
    <div>
        <div class="slds-form-element">
            <div class="slds-form-element__control">
                <div class="slds-combobox_container">
                    <div id="box" class={boxClass} aria-expanded="true" aria-haspopup="listbox" role="combobox">
                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                            <template if:true={isValueSelected}>
                                <div class="slds-p-top_none">
                                    <lightning-input class={inputClass} type={inputType} id="input1" value={selectedName}
                                                     onclick={handleClick} onblur={onBlur} onchange={onChange}
                                                     variant="label-hidden" autocomplete="off" placeholder={searchPlaceholder}
                                                     disabled={disabled} name="input">
                                    </lightning-input>
                                </div>
                            </template>
                            <template if:false={isValueSelected}>
                                <div class="slds-p-top_none">
                                    <lightning-input class={inputClass} type={inputType} id="input" value={searchTerm}
                                                     onclick={handleClick} onblur={onBlur} onchange={onChange}
                                                     variant="label-hidden" autocomplete="off" placeholder={searchPlaceholder}
                                                     disabled={disabled} name="input">
                                    </lightning-input>
                                </div>
                            </template>
                        </div>
 
                        <div id="listbox-id-1"
                            class="slds-listbox slds-listbox_vertical slds-dropdown slds-dropdown_fluid slds-dropdown_length-with-icon-5 slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open"
                            onscroll={handleOnScroll} data-id="slds-scrollable" role="listbox">
                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                <template for:each={scrollRecord} for:item="record">
                                    <li key={record.Id} onclick={onSelect} data-id={record.Id} role="presentation"
                                        data-name={record.Name}>
                                        <span class="slds-lookup__item-action slds-lookup__item-action--label"
                                            role="option">
                                            <lightning-icon class="slds-icon slds-icon--small slds-icon-text-default"
                                                icon-name={iconName} alternative-text={objName}
                                                size="small"></lightning-icon>
                                            <span class="slds-truncate">{record.Name}</span>
                                        </span>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
